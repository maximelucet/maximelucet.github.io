# Each category becomes a fold on the Publications page.
#   id:    colour of the category (preprint, international, workshop, national)
#   open:  true to have the fold open when the page loads
# Each paper:
#   title, authors (list), year            required
#   venue, details                          optional (shown as "venue · details")
#   links                                   optional, label: url — the title links to the first one.
#                                           Local files go in static/files/ and are written files/name.pdf

