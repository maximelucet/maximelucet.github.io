<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if title %}{{ title }} · {% endif %}{{ profile.name }}</title>
  <meta name="description" content="{{ profile.name }} — {{ profile.tagline }}">
  <link rel="icon" href="{{ 'favicon.svg'|url }}" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT,WONK@9..144,600,100,1&family=Inter:wght@400;500;600;700&family=Nunito:wght@600;700&family=Newsreader:opsz,wght@6..72,500;6..72,600&display=swap">
  <link rel="stylesheet" href="{{ 'css/style.css'|url }}">
  <script>try { var t = localStorage.getItem("theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}</script>
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="{{ ''|url }}">{{ profile.name }}</a>
      <nav class="nav" aria-label="Main">
        {% for item in nav %}
        <a href="{{ item.path|url }}"{% if item.path == current %} aria-current="page"{% endif %}>{{ item.label }}</a>
        {% endfor %}
      </nav>
      <button class="theme-toggle" type="button" aria-label="Toggle dark mode" title="Toggle dark mode">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/></svg>
      </button>
    </div>
  </header>

  <main class="container">
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <p>© {{ year }} {{ profile.name }} · {{ profile.tagline }}</p>
      <p>
        <a href="mailto:{{ profile.email }}">{{ profile.email }}</a>
        · <a href="{{ profile.linkedin }}">LinkedIn</a>
      </p>
    </div>
  </footer>

  <script>
    document.querySelector(".theme-toggle").addEventListener("click", function () {
      var root = document.documentElement;
      var current = root.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      var next = current === "dark" ? "light" : "dark";
      root.dataset.theme = next;
      try { localStorage.setItem("theme", next); } catch (e) {}
    });
    document.querySelectorAll('a[href^="http"]').forEach(function (a) {
      a.target = "_blank";
      a.rel = "noopener";
    });
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
